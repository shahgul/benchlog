<!doctype html>
<html lang="en" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchlog, Signal mockup</title>
<meta name="color-scheme" content="dark light">
<script>
  /* Theme before first paint so there is no flash. */
  try { var s = localStorage.getItem('benchlog-scheme'); if (s === 'light' || s === 'dark') document.documentElement.dataset.scheme = s; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@85..140,500..800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
  SIGNAL mockup. Standalone: no build, no app code.

  Decisions
  - Hierarchy: the Overview answers one question first, "what warranty ends next and what do I do about it".
    That is the hero. Everything below is ordered by how soon you will need it:
    still covered, not covered, then money and places.
  - One navigation: a top bar on desktop, a bottom dock on phones. No side rail.
  - One effect per view: the hero border beam on Overview. Item pages use none beyond the cable drawing in.
  - The cable: cord = time already used, glowing rails between plug and socket = warranty left,
    plug at today. When the warranty ends the plug lies loose beside the socket and the rails go out.
  - Paper white is used only on the item sheet.
  - Type: Anybody (wide, hardware-label feel) for numbers and headings, Schibsted Grotesk for reading.
*/

:root {
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font-display: 'Anybody', 'Arial Narrow', system-ui, sans-serif;
  --font-body: 'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-hero: 28px; --r-tile: 22px; --r-row: 14px;
}

/* ---------- Tokens: dark (default) ---------- */
:root, html[data-scheme='dark'] {
  color-scheme: dark;
  --bg: #06070a; --s1: #0d0f15; --s2: #151821; --s3: #1d212d;
  --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.16);
  --tx: #eceff6; --mu: #98a0b6; --faint: #656d84;
  --focus: #9dbbff;
  --act: #4f8cff;  --act-t: #8fb3ff;
  --soon: #ffb224; --soon-t: #ffc457;
  --end: #ff5c63;  --end-t: #ff8d92;
  --none: #6b7388; --none-t: #98a0b6;
  --plug: #262b3a; --plug-edge: #475069; --pin: #c9cfdf; --sock: #181b26; --sock-edge: #343b50; --cord-base: #2a3042;
  --glow-a: .55;
  --wash: rgba(79,140,255,.07);
}
/* ---------- Tokens: light ---------- */
html[data-scheme='light'] {
  color-scheme: light;
  --bg: #e9ecf2; --s1: #ffffff; --s2: #f3f5f9; --s3: #e6e9f1;
  --line: rgba(12,16,30,.09); --line2: rgba(12,16,30,.2);
  --tx: #0c1018; --mu: #4f576c; --faint: #8089a0;
  --focus: #1d4ed0;
  --act: #2f66f0;  --act-t: #1d4ed0;
  --soon: #e59400; --soon-t: #8a5300;
  --end: #e0343f;  --end-t: #b4232c;
  --none: #8a91a4; --none-t: #4f576c;
  --plug: #d4d9e6; --plug-edge: #8d96ad; --pin: #626b83; --sock: #e2e6f0; --sock-edge: #aab2c6; --cord-base: #cdd3e1;
  --glow-a: .3;
  --wash: rgba(47,102,240,.06);
}

/* Status sets --c (graphic), --cg (bright, for dark strips), --ct (readable text) */
[data-status='active'] { --c: var(--act);  --cg: #5b97ff; --ct: var(--act-t); }
[data-status='soon']   { --c: var(--soon); --cg: #ffb224; --ct: var(--soon-t); }
[data-status='ended']  { --c: var(--end);  --cg: #ff5c63; --ct: var(--end-t); }
[data-status='none']   { --c: var(--none); --cg: #6b7388; --ct: var(--none-t); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--tx);
  font: 400 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
body::before { /* one quiet static wash, not an effect */
  content: ''; position: fixed; inset: 0 0 auto 0; height: 520px; pointer-events: none; z-index: -1;
  background: radial-gradient(60% 100% at 18% 0%, var(--wash), transparent 70%);
}
.big, .money, .r-stat, .legend b, .ends b, .fact b, .spec .mono, .tag { font-variant-numeric: tabular-nums; }
h1, h2, h3, p, dl, dd, ul { margin: 0; padding: 0; }
ul { list-style: none; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 100; background: var(--tx); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; }
.skip:focus { top: 12px; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Top bar (desktop) / dock (phone) ---------- */
.bar {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
  border-bottom: 1px solid var(--line);
}
.bar-in { max-width: 1180px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 20px/1 var(--font-display); font-stretch: 125%; letter-spacing: -.01em; }
.brand svg { width: 30px; height: 20px; }
.nav { position: relative; display: flex; gap: 2px; margin-right: auto; }
.nav a { position: relative; z-index: 1; padding: 8px 14px; border-radius: 999px; color: var(--mu); font-weight: 500; transition: color .2s; }
.nav a:hover { color: var(--tx); }
.nav a[aria-current='page'] { color: var(--tx); }
.nav .pill { position: absolute; z-index: 0; left: 0; top: 0; height: 100%; width: 0; border-radius: 999px; background: var(--s3); transition: transform .5s var(--spring), width .5s var(--spring), opacity .2s; opacity: 0; }
.tools { display: flex; align-items: center; gap: 8px; }
.find {
  display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 14px; min-width: 236px;
  border: 1px solid var(--line2); border-radius: 999px; color: var(--mu);
  transition: border-color .2s, background .2s, transform .35s var(--spring);
}
.find:hover { background: var(--s1); color: var(--tx); }
.find:active { transform: scale(.97); }
.find span { margin-right: auto; }
kbd { font: 500 12px/1 var(--font-body); padding: 5px 8px; border-radius: 8px; background: var(--s3); color: var(--mu); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; color: var(--mu); transition: background .2s, color .2s, transform .35s var(--spring); }
.icon-btn:hover { background: var(--s3); color: var(--tx); }
.icon-btn:active { transform: scale(.9); }
.theme .moon { display: none; }
html[data-scheme='light'] .theme .sun { display: none; }
html[data-scheme='light'] .theme .moon { display: block; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px;
  border-radius: 999px; font-weight: 600; white-space: nowrap;
  transition: transform .4s var(--spring), background .2s, box-shadow .25s, border-color .2s;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: scale(.96); }
.btn-solid { background: var(--tx); color: var(--bg); }
.btn-solid:hover { box-shadow: 0 8px 28px -8px color-mix(in oklab, var(--cg, var(--act)) 70%, transparent); }
.btn-line { border: 1px solid var(--line2); }
.btn-line:hover { background: var(--s2); }
.btn-sm { height: 40px; padding: 0 16px; }

.dock { display: none; }

/* ---------- Page ---------- */
main { max-width: 1180px; margin: 0 auto; padding: 28px 24px 120px; outline: none; }
.title { font: 700 clamp(30px, 4vw, 40px)/1.05 var(--font-display); font-stretch: 120%; letter-spacing: -.02em; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.page-head p { color: var(--mu); margin-top: 6px; }

/* ---------- Status chip (always carries words) ---------- */
.chip { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ct); background: color-mix(in oklab, var(--c) 14%, transparent); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
[data-status='ended'] .chip i, [data-status='none'] .chip i { box-shadow: none; }

/* ---------- The cable ---------- */
@property --k { syntax: '<number>'; inherits: true; initial-value: 1; }
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

.cable {
  --h: 26px; --pw: calc(var(--h) * 1.5); --sw: calc(var(--h) * 1.1); --p: .5; --lc: var(--c);
  --t: max(3px, calc(var(--h) * .11));
  --plug-x: calc((100% - var(--sw) - var(--pw)) * var(--p) * var(--k));
  position: relative; display: block; width: 100%; height: var(--h);
}
.cable .cord {
  position: absolute; left: 0; top: 50%; height: var(--t); transform: translateY(-50%); border-radius: 99px;
  width: calc(var(--plug-x) + var(--pw) * .12);
  background: color-mix(in oklab, var(--lc) 42%, var(--cord-base));
}
.cable .rail {
  position: absolute; height: 2px; border-radius: 2px; background: var(--lc);
  left: calc(var(--plug-x) + var(--pw) * .96); right: calc(var(--sw) * .94);
  box-shadow: 0 0 6px var(--lc), 0 0 18px color-mix(in oklab, var(--lc) calc(var(--glow-a) * 100%), transparent);
}
.cable .r1 { top: calc(var(--h) * .328 - 1px); }
.cable .r2 { top: calc(var(--h) * .672 - 1px); }
.cable .plug { position: absolute; top: 0; left: var(--plug-x); width: var(--pw); height: var(--h); }
.cable .socket { position: absolute; top: 0; right: 0; width: var(--sw); height: var(--h); }
.cable:not([data-state='ended']):not([data-state='none']) .socket { filter: drop-shadow(0 0 5px color-mix(in oklab, var(--lc) 55%, transparent)); }
.cable:not([data-state='ended']):not([data-state='none']) .socket .slot { fill: color-mix(in oklab, var(--lc) 70%, #000); }

/* Ended: no light, plug lies loose beside the socket */
.cable[data-state='ended'] .rail { display: none; }
.cable[data-state='ended'] .plug {
  left: calc(100% - var(--sw) - var(--pw) - var(--h) * .55);
  transform: translateY(calc(var(--h) * .3)) rotate(-17deg); transform-origin: 30% 50%;
}
.cable[data-state='ended'] .cord { top: calc(50% + var(--h) * .22); width: calc(100% - var(--sw) - var(--pw) - var(--h) * .55 + var(--pw) * .14); background: color-mix(in oklab, var(--lc) 34%, var(--cord-base)); }
.cable[data-state='ended'] .socket .slot { fill: #05060a; }
/* No warranty: empty socket, dashed run */
.cable[data-state='none'] .plug, .cable[data-state='none'] .rail { display: none; }
.cable[data-state='none'] .cord { background: none; height: 0; border-top: 2px dashed var(--faint); border-radius: 0; width: calc(100% - var(--sw) * 1.1); opacity: .6; }
.cable .slot { fill: #07080c; }

/* Dark inset strip: the "lit" surface. Same in light and dark so the glow always reads. */
.strip {
  --lc: var(--cg);
  --plug: #2a3043; --plug-edge: #56607c; --pin: #d7dcea; --sock: #1a1e2b; --sock-edge: #3a425a; --cord-base: #2c3347; --glow-a: .55;
  --faint: #6b7388; --mu: #a2a9be; --tx: #eceff6;
  position: relative; border-radius: 20px; padding: 56px clamp(18px, 3vw, 34px) 24px; background:
    radial-gradient(70% 120% at 20% 0%, color-mix(in oklab, var(--cg) 11%, transparent), transparent 70%), #090b11;
  border: 1px solid rgba(255,255,255,.07); color: var(--tx);
}
.strip .cable { --h: clamp(44px, 7vw, 64px); }
.strip .ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 18px; color: var(--mu); font-size: 14px; }
.strip .ends b { display: block; color: var(--tx); font-weight: 600; font-size: 15px; }
.strip .ends > div:last-child { text-align: right; }
.strip .cable[data-state='ended'] { margin-bottom: calc(var(--h) * .55); }
.today {
  position: absolute; bottom: calc(100% + 12px); white-space: nowrap; font-size: 13px; font-weight: 600; color: #eceff6;
  left: clamp(1.6rem, calc(var(--plug-x) + var(--pw) * .4), calc(100% - 1.6rem)); transform: translateX(-50%);
  padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1);
}
.today::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 8px; background: rgba(255,255,255,.35); }

/* Draw-in: plug travels to today and the cord pays out behind it */
@media (prefers-reduced-motion: no-preference) {
  .cable { animation: draw 1.15s var(--ease) both; }
  .cable[data-vtn] { animation: none; }
  @keyframes draw { from { --k: 0; } to { --k: 1; } }
  @keyframes beam { to { --a: 360deg; } }
}

/* ---------- Bento ---------- */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.tile { grid-column: span 12; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-tile); padding: 24px; min-width: 0; }
.tile > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.tile h2 { font: 650 20px/1.2 var(--font-display); font-stretch: 115%; letter-spacing: -.01em; }
.tile header span { color: var(--mu); font-size: 14px; }
.t-covered { grid-column: span 7; } .t-out { grid-column: span 5; }
.t-spent { grid-column: span 5; } .t-places { grid-column: span 7; }

/* Hero */
.hero { position: relative; grid-column: span 12; border-radius: var(--r-hero); padding: clamp(22px, 3.4vw, 40px); background:
  radial-gradient(60% 90% at 0% 0%, color-mix(in oklab, var(--c) 9%, transparent), transparent 70%), var(--s1);
  border: 1px solid var(--line); }
.hero::before { /* the one effect on this view: border beam */
  content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 2px; pointer-events: none;
  background: conic-gradient(from var(--a), transparent 0 72%, var(--cg) 88%, #fff 94%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: .9;
}
@media (prefers-reduced-motion: no-preference) { .hero::before { animation: beam 7s linear infinite; } }
@media (prefers-reduced-motion: reduce) { .hero::before { background: var(--line2); opacity: 1; } }
.hero-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--mu); }
.hero-h { display: flex; align-items: center; gap: clamp(16px, 3vw, 36px); margin: clamp(14px, 2.4vw, 26px) 0 clamp(18px, 3vw, 30px); }
.big { display: flex; align-items: baseline; gap: .18em; white-space: nowrap; font: 700 clamp(84px, 13vw, 152px)/.82 var(--font-display); font-stretch: 130%; letter-spacing: -.035em; color: var(--tx); }
.big small { font: 600 clamp(22px, 3vw, 34px)/1 var(--font-display); font-stretch: 115%; letter-spacing: -.01em; color: var(--ct); }
.lede { font: 500 clamp(18px, 2vw, 24px)/1.3 var(--font-body); max-width: 24ch; color: var(--tx); text-wrap: balance; }
.lede span { color: var(--mu); display: block; margin-top: 8px; font-size: .78em; }
.hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 20px 32px; margin-top: 26px; flex-wrap: wrap; }
.hero-foot .hint { color: var(--mu); max-width: 46ch; }
.hero-foot .acts { display: flex; gap: 10px; flex-wrap: wrap; }

/* Rows */
.rows { display: grid; gap: 2px; margin: 0 -10px; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(70px, .9fr) max-content; align-items: center; gap: 18px;
  padding: 12px 10px; border-radius: var(--r-row);
  transition: background .2s, transform .45s var(--spring);
}
.row:hover { background: var(--s2); transform: translateX(3px); }
.row:active { transform: scale(.99); }
.row:hover .cable { filter: brightness(1.18); }
.r-main { min-width: 0; }
.r-main b, .r-stat b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-main small, .r-stat small { display: block; color: var(--mu); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-stat { text-align: right; min-width: 0; }
.r-stat b { color: var(--ct); }
.r-cable { padding-bottom: 4px; }
.cable-ended-pad { padding-bottom: 10px; }

/* Spent */
.money { font: 700 clamp(40px, 5.2vw, 56px)/1 var(--font-display); font-stretch: 125%; letter-spacing: -.03em; }
.money small { font-size: .5em; letter-spacing: 0; margin-right: 2px; color: var(--mu); }
.t-spent p.sub { color: var(--mu); margin: 8px 0 20px; }
.stack { display: flex; gap: 3px; height: 14px; }
.stack i { display: block; border-radius: 5px; min-width: 6px; transition: transform .4s var(--spring); transform-origin: bottom; }
.stack i:hover { transform: scaleY(1.5); }
.legend { margin-top: 16px; display: grid; gap: 8px; }
.legend li { display: flex; align-items: center; gap: 10px; }
.legend li i { width: 10px; height: 10px; border-radius: 50%; }
.legend li b { margin-left: auto; font-weight: 600; }
.legend li span { color: var(--mu); }

/* Places */
.places { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.place { padding: 16px; border-radius: 16px; background: var(--s2); border: 1px solid transparent; transition: border-color .2s, transform .45s var(--spring); }
.place:hover { border-color: var(--line2); transform: translateY(-3px); }
.place b { display: block; font: 650 17px/1.2 var(--font-display); font-stretch: 112%; }
.place span { display: block; color: var(--mu); font-size: 13.5px; margin-top: 2px; }
.place p { font-size: 14px; margin-top: 10px; }

/* Preview-date control (mockup tool) */
.preview { margin-top: 36px; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; color: var(--mu); font-size: 14px; }
.seg { display: inline-flex; padding: 4px; border-radius: 999px; background: var(--s1); border: 1px solid var(--line); }
.seg button { height: 34px; padding: 0 14px; border-radius: 999px; font-weight: 500; color: var(--mu); transition: background .3s var(--spring), color .2s; }
.seg button:hover { color: var(--tx); }
.seg button[aria-pressed='true'] { background: var(--tx); color: var(--bg); }

/* Filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { height: 38px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line2); color: var(--mu); font-weight: 500; transition: background .25s, color .2s, transform .4s var(--spring); }
.filters button:hover { color: var(--tx); transform: translateY(-1px); }
.filters button[aria-pressed='true'] { background: var(--tx); color: var(--bg); border-color: var(--tx); }

/* ---------- Item sheet: the only paper ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--mu); margin-bottom: 18px; padding: 6px 10px 6px 4px; border-radius: 999px; transition: color .2s, transform .4s var(--spring); }
.back:hover { color: var(--tx); transform: translateX(-3px); }
.paper {
  --bg: #f7f2e7; --tx: #1d1a14; --mu: #675f50; --faint: #9a917f; --line: rgba(40,30,10,.12); --line2: rgba(40,30,10,.26);
  --s2: #efe8d9; --s3: #e6decb; --focus: #1d4ed0; --act-t: #1d4ed0; --soon-t: #855000; --end-t: #b4232c; --none-t: #5d5a52;
  background: var(--bg); color: var(--tx); border-radius: 30px; padding: clamp(20px, 4vw, 52px);
  box-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 40px 80px -30px rgba(0,0,0,.65);
}
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 28px; }
.tag { font-size: 14px; color: var(--mu); font-weight: 500; margin-bottom: 10px; display: block; letter-spacing: .02em; }
.sheet-head h1 { font: 700 clamp(38px, 6vw, 68px)/.98 var(--font-display); font-stretch: 125%; letter-spacing: -.03em; text-wrap: balance; }
.sheet-head .model { font-size: 18px; color: var(--mu); margin-top: 10px; }
.sheet-head .acts { display: flex; gap: 10px; flex-wrap: wrap; }
.paper .btn-solid { background: var(--tx); color: var(--bg); }
.paper .btn-line:hover { background: var(--s2); }
.verdict { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 22px 0 0; }
.verdict .chip { height: 34px; font-size: 15px; background: color-mix(in oklab, var(--c) 16%, transparent); }
.verdict p { font-weight: 600; font-size: 18px; color: var(--ct); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.fact { padding: 16px 18px; border-radius: 16px; background: var(--s2); }
.fact span { display: block; color: var(--mu); font-size: 14px; }
.fact b { display: block; font: 650 20px/1.25 var(--font-display); font-stretch: 112%; margin-top: 4px; }
.fact small { color: var(--mu); font-size: 13.5px; }
.sheet-cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; margin-top: 40px; }
.sheet-cols h2 { font: 650 22px/1.2 var(--font-display); font-stretch: 115%; margin-bottom: 8px; }
.spec { display: grid; }
.spec > div { display: grid; grid-template-columns: 9.5em 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.spec dt { color: var(--mu); }
.spec dd { font-weight: 500; display: flex; align-items: center; gap: 8px; min-width: 0; overflow-wrap: anywhere; }
.spec .mono { letter-spacing: .06em; font-weight: 600; }
.mini-copy { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--mu); transition: background .2s, transform .35s var(--spring); }
.mini-copy:hover { background: var(--s3); color: var(--tx); }
.mini-copy:active { transform: scale(.88); }
.mini-copy .ic { width: 18px; height: 18px; }
.drop { display: grid; gap: 6px; place-items: center; text-align: center; padding: 30px 20px; border: 2px dashed var(--line2); border-radius: 20px; width: 100%; color: var(--mu); transition: border-color .2s, background .25s, transform .4s var(--spring); }
.drop:hover { border-color: var(--tx); background: var(--s2); transform: scale(1.01); }
.drop b { color: var(--tx); font-size: 17px; }
.drop .ic { width: 26px; height: 26px; color: var(--tx); margin-bottom: 4px; }
.notes { margin-top: 28px; color: var(--mu); }
.notes h3 { font-weight: 600; color: var(--tx); font-size: 17px; margin-bottom: 4px; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--line); }
.pager a { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; max-width: 48%; transition: background .2s, transform .4s var(--spring); }
.pager a:hover { background: var(--s2); }
.pager a.next { margin-left: auto; text-align: right; }
.pager a.prev:hover { transform: translateX(-3px); } .pager a.next:hover { transform: translateX(3px); }
.pager small { display: block; color: var(--mu); font-size: 13.5px; }
.pager b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Command palette ---------- */
dialog.palette { padding: 0; border: 1px solid var(--line2); border-radius: 22px; background: var(--s1); color: var(--tx); width: min(600px, calc(100vw - 32px)); margin: 12vh auto auto; box-shadow: 0 40px 100px -20px rgba(0,0,0,.7); overflow: hidden; }
dialog.palette::backdrop { background: rgba(3,4,8,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
@media (prefers-reduced-motion: no-preference) {
  dialog.palette[open] { animation: pop .38s var(--spring); }
  dialog.palette[open]::backdrop { animation: fade .25s ease; }
  @keyframes pop { from { opacity: 0; transform: translateY(-14px) scale(.96); } }
  @keyframes fade { from { opacity: 0; } }
}
.palette .q { display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); color: var(--mu); }
.palette input { flex: 1; height: 58px; background: none; border: 0; color: var(--tx); font: 500 17px var(--font-body); outline: none; }
.palette ul { max-height: min(50vh, 380px); overflow: auto; padding: 8px; }
.palette li button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; border-radius: 12px; }
.palette li button[aria-selected='true'] { background: var(--s3); }
.palette li small { margin-left: auto; color: var(--mu); }
.palette .none { padding: 22px; color: var(--mu); text-align: center; }
.palette .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translate(-50%, 24px); opacity: 0; pointer-events: none; padding: 12px 20px; border-radius: 999px; background: var(--tx); color: var(--bg); font-weight: 600; box-shadow: 0 16px 40px -10px rgba(0,0,0,.5); transition: transform .5s var(--spring), opacity .25s; max-width: calc(100vw - 32px); }
.toast.on { transform: translate(-50%, 0); opacity: 1; }

/* View transitions */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .32s; animation-timing-function: var(--ease); }
::view-transition-group(cable) { animation-duration: .55s; animation-timing-function: var(--ease); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}

/* ---------- Responsive ---------- */
@media (max-width: 1000px) {
  .t-covered, .t-out, .t-spent, .t-places { grid-column: span 12; }
  .sheet-cols { grid-template-columns: 1fr; gap: 32px; }
  .find { min-width: 0; } .find span { display: none; }
}
@media (max-width: 760px) {
  .nav, .bar .add { display: none; }
  .bar-in { padding: 0 16px; height: 56px; }
  .find { padding: 0; width: 40px; min-width: 0; justify-content: center; border: 0; } .find kbd { display: none; }
  main { padding: 20px 16px 130px; }
  .tile { padding: 20px 18px; }
  .hero-h { flex-direction: column; align-items: flex-start; gap: 14px; }
  .lede { max-width: 30ch; }
  .strip { padding-top: 54px; }
  .hero-foot .acts { width: 100%; } .hero-foot .acts .btn { flex: 1; }
  .row { grid-template-columns: minmax(0, 1fr) minmax(0, auto); grid-template-areas: 'main stat' 'cable cable'; gap: 8px 12px; }
  .row .r-main { grid-area: main; } .row .r-stat { grid-area: stat; } .row .r-cable { grid-area: cable; }
  .facts { grid-template-columns: 1fr; }
  .fact { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px 12px; }
  .fact small { grid-column: 1 / -1; }
  .fact b { margin-top: 0; text-align: right; }
  .spec > div { grid-template-columns: 8em 1fr; }
  .pager a { max-width: 49%; padding: 8px 4px; }
  .toast { bottom: 108px; }
  .dock {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 40; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
    padding: 6px; border-radius: 26px; background: color-mix(in oklab, var(--s1) 86%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    border: 1px solid var(--line2); box-shadow: 0 18px 40px -12px rgba(0,0,0,.55);
  }
  .dock a, .dock button { display: grid; place-items: center; gap: 2px; padding: 8px 2px 6px; border-radius: 20px; font-size: 12px; font-weight: 500; color: var(--mu); transition: background .25s, color .2s, transform .4s var(--spring); }
  .dock a[aria-current='page'] { color: var(--tx); background: var(--s3); }
  .dock .fab { color: var(--bg); background: var(--tx); width: 56px; height: 56px; padding: 0; margin: -16px auto 0; border-radius: 50%; align-content: center; box-shadow: 0 10px 24px -6px rgba(0,0,0,.5); }
  .hero-foot .acts .btn-solid { order: -1; }
  .dock .fab .ic { width: 26px; height: 26px; }
  .dock a:active, .dock button:active { transform: scale(.9); }
}
@media (max-width: 420px) {
  .big { font-size: clamp(76px, 25vw, 100px); }
  .money { font-size: 40px; }
}
</style>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const DAY = 864e5;

  /* ---------- Data: the seven items from src/sample.ts, dates relative to the real today ---------- */
  const anchor = (monthsAgo, extra = 0) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setMonth(d.getMonth() - monthsAgo); d.setDate(d.getDate() + extra); return d; };
  const RAW = [
    ['Work laptop',         'Laptop',  'Lenovo', 'ThinkPad T14',  'PF3K91LX', 10, 0,  92000,  'Croma',       36, 'Desk',         1],
    ['Gaming tablet',       'Tablet',  'Lenovo', 'Legion Y700',   'HA2201B7',  5, 0,  32999,  'Amazon',      12, 'Bag',          1],
    ['Main monitor',        'Monitor', 'Dell',   'U2723QE',       'CN0W8M44', 11, 12, 54500,  'Dell store',  12, 'Desk',         1],
    ['Mirrorless body',     'Camera',  'Sony',   'A7 III',        '4829113',  30, 0,  148000, 'Sony Center', 24, 'Dry cabinet',  1],
    ['USB-C to HDMI cable', 'Cable',   'Anker',  '2 m 4K',        '',          3, 0,  1299,   'Amazon',      18, 'Cable drawer', 2],
    ['GaN charger',         'Charger', 'Ugreen', '100 W 4-port',  '',         14, 0,  3499,   'Amazon',      12, 'Desk',         1],
    ['Desk lamp',           'Other',   'Xiaomi', 'Mi LED 1S',     '',          2, 0,  2499,   'Mi Home',      0, '',             1],
  ];
  const ITEMS = RAW.map((r, i) => ({
    id: i + 1, tag: 'BL-' + String(i + 1).padStart(4, '0'),
    name: r[0], category: r[1], brand: r[2], model: r[3], serial: r[4], bought: anchor(r[5], r[6]),
    price: r[7], store: r[8], months: r[9], location: r[10], qty: r[11], files: 0, notes: '',
  }));

  /* ---------- Preview date (mockup tool, so every status can be seen) ---------- */
  let offset = 0;
  const now = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + offset); return d; };
  const daysBetween = (a, b) => Math.round((b - a) / DAY);

  function warranty(it) {
    if (!it.months) return { status: 'none', left: null };
    const T = now(); const end = new Date(it.bought); end.setMonth(end.getMonth() + it.months);
    const left = daysBetween(T, end);
    const total = end - it.bought; const frac = Math.min(.97, Math.max(.03, (T - it.bought) / total));
    const status = left < 0 ? 'ended' : left <= 30 ? 'soon' : 'active';
    return { status, left, end, frac };
  }
  const enriched = () => ITEMS.map(it => ({ ...it, w: warranty(it) }));

  /* ---------- Formatting ---------- */
  const fdate = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const money = n => '₹' + n.toLocaleString('en-IN');
  const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
  function amount(days) { // { n, unit }
    const d = Math.abs(days);
    if (d <= 60) return { n: d, unit: d === 1 ? 'day' : 'days' };
    const m = Math.round(d / 30.44); return { n: m, unit: m === 1 ? 'month' : 'months' };
  }
  const amountText = d => { const a = amount(d); return a.n + ' ' + a.unit; };
  function stat(w) { // [line one (coloured, in words), line two]
    if (w.status === 'none') return ['No warranty', 'Nothing to track'];
    if (w.status === 'ended') return ['Ended ' + amountText(w.left) + ' ago', 'Ended ' + fdate(w.end)];
    const one = w.left === 0 ? 'Ends today' : amountText(w.left) + ' left';
    return [one, (w.status === 'soon' ? 'Ending soon: ' : 'Covered until ') + fdate(w.end)];
  }
  const WORD = { active: 'Covered', soon: 'Ending soon', ended: 'Ended', none: 'No warranty' };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* ---------- Components ---------- */
  function cable(it, { h, extra = '' } = {}) {
    const w = it.w; const p = w.status === 'ended' ? 1 : w.status === 'none' ? 0 : w.frac;
    return `<span class="cable" data-id="${it.id}" data-state="${w.status}" style="${h ? `--h:${h}px;` : ''}--p:${p.toFixed(3)}" aria-hidden="true">` +
      `<span class="cord"></span><span class="rail r1"></span><span class="rail r2"></span>` +
      `<svg class="plug" viewBox="0 0 60 40"><use href="#plug-g"/></svg><svg class="socket" viewBox="0 0 44 40"><use href="#socket-g"/></svg>${extra}</span>`;
  }
  function row(it) {
    const [a, b] = stat(it.w);
    return `<li><a class="row" href="#item-${it.id}" data-status="${it.w.status}" aria-label="${esc(it.name)}, ${esc(a)}">` +
      `<span class="r-main"><b>${esc(it.name)}</b><small>${esc(it.brand + ' ' + it.model)}</small></span>` +
      `<span class="r-cable ${it.w.status === 'ended' ? 'cable-ended-pad' : ''}">${cable(it, { h: 26 })}</span>` +
      `<span class="r-stat"><b>${esc(a)}</b><small>${esc(b)}</small></span></a></li>`;
  }
  const icon = (d, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
  const I = {
    copy: icon('<rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/>'),
    plus: icon('<path d="M12 5v14M5 12h14"/>'),
    left: icon('<path d="m15 18-6-6 6-6"/>'), right: icon('<path d="m9 18 6-6-6-6"/>'),
    file: icon('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-5M9.5 14.5 12 12l2.5 2.5"/>'),
    open: icon('<path d="M7 17 17 7M8 7h9v9"/>'),
    edit: icon('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>'),
  };

  /* ---------- Views ---------- */
  function overview() {
    const list = enriched();
    const live = list.filter(i => ['active', 'soon'].includes(i.w.status)).sort((a, b) => a.w.end - b.w.end);
    const gone = list.filter(i => ['ended', 'none'].includes(i.w.status)).sort((a, b) => (a.w.end || 0) - (b.w.end || 0)).reverse();
    const hero = live[0] || gone[0];
    const rest = live.slice(1);
    const w = hero.w; const a = amount(Math.abs(w.left ?? 0));
    const inv = hero.files ? '' : 'No invoice is attached yet. A claim goes faster when you have it.';

    const heroHtml = `
    <section class="hero" data-status="${w.status}" aria-labelledby="hero-h">
      <div class="hero-top"><span class="chip"><i></i>${WORD[w.status]}</span><span>${esc(hero.tag)}, ${esc(hero.brand + ' ' + hero.model)}</span></div>
      <h1 class="hero-h" id="hero-h">
        <span class="big" aria-hidden="true">${a.n}<small>${a.unit}</small></span>
        <span class="lede"><span class="sr">${amountText(w.left)} left on </span>${w.status === 'ended' ? 'The ' + esc(hero.name) + ' is out of warranty.' : (w.left === 0 ? 'Today is the last day of' : 'left on') + ' the ' + esc(hero.name) + '’s warranty.'}<span>Ends ${fdate(w.end)}</span></span>
      </h1>
      ${strip(hero)}
      <div class="hero-foot">
        <p class="hint">${inv || 'Everything is on file for this one.'}</p>
        <div class="acts">
          ${hero.files ? '' : `<a class="btn btn-line" href="#item-${hero.id}">${I.file}Add the invoice</a>`}
          <button class="btn btn-line" data-copy="${esc(hero.serial)}">${I.copy}Copy serial number</button>
          <a class="btn btn-solid" href="#item-${hero.id}">Open item${I.open}</a>
        </div>
      </div>
    </section>`;

    const spentTotal = ITEMS.reduce((s, i) => s + i.price, 0);
    const cats = [['Camera', 148000], ['Laptop', 92000], ['Monitor', 54500], ['Tablet', 32999]];
    const small = spentTotal - cats.reduce((s, c) => s + c[1], 0);
    const tints = ['#3d7bff', '#6b9bff', '#97b8ff', '#c1d3ff', '#5a6280'];
    const parts = [...cats, ['Charger, cable and lamp', small]];
    const stack = parts.map((p, i) => `<i style="flex:${p[1]};background:${tints[i]}" title="${esc(p[0])} ${money(p[1])}"></i>`).join('');
    const legend = parts.map((p, i) => `<li><i style="background:${tints[i]}"></i><span>${esc(p[0])}</span><b>${money(p[1])}</b></li>`).join('');

    const places = {};
    ITEMS.forEach(i => { (places[i.location || 'No place set'] ||= []).push(i); });
    const placeHtml = Object.entries(places).sort((x, y) => y[1].length - x[1].length).map(([n, arr]) => {
      const units = arr.reduce((s, i) => s + i.qty, 0);
      return `<div class="place"><b>${esc(n)}</b><span>${plural(units, 'unit')}</span><p>${arr.map(i => esc(i.name)).join(', ')}</p></div>`;
    }).join('');

    const nUnits = ITEMS.reduce((s, i) => s + i.qty, 0);
    return `
    <div class="bento">
      ${heroHtml}
      <section class="tile t-covered" aria-labelledby="h-cov">
        <header><h2 id="h-cov">Still covered</h2><span>${plural(rest.length, 'more item')}, soonest first</span></header>
        ${rest.length ? `<ul class="rows">${rest.map(row).join('')}</ul>` : '<p style="color:var(--mu)">Nothing else is covered right now.</p>'}
      </section>
      <section class="tile t-out" aria-labelledby="h-out">
        <header><h2 id="h-out">Not covered</h2><span>${plural(gone.filter(g => g.id !== hero.id).length, 'item')}</span></header>
        <ul class="rows">${gone.filter(g => g.id !== hero.id).map(row).join('')}</ul>
      </section>
      <section class="tile t-spent" aria-labelledby="h-spent">
        <header><h2 id="h-spent">Spent</h2><span>${plural(ITEMS.length, 'item')}, ${plural(nUnits, 'unit')}</span></header>
        <div class="money"><small>₹</small>${spentTotal.toLocaleString('en-IN')}</div>
        <p class="sub">Across everything on the bench. The camera is the biggest share.</p>
        <div class="stack" role="img" aria-label="Spend by category">${stack}</div>
        <ul class="legend">${legend}</ul>
      </section>
      <section class="tile t-places" aria-labelledby="h-pl">
        <header><h2 id="h-pl">Where things are</h2><span>${Object.keys(places).length} places</span></header>
        <div class="places">${placeHtml}</div>
      </section>
    </div>
    <div class="preview">
      <span>Mockup only: move today forward to see every status.</span>
      <div class="seg" role="group" aria-label="Preview date">
        ${[[0, 'Today'], [21, 'In 3 weeks'], [100, 'In 100 days']].map(([v, l]) => `<button data-offset="${v}" aria-pressed="${offset === v}">${l}</button>`).join('')}
      </div>
      ${offset ? `<span>Showing ${fdate(now())}</span>` : ''}
    </div>`;
  }

  function strip(it) {
    const w = it.w; const dated = `<div class="ends"><div><span>Bought</span><b>${fdate(it.bought)}</b></div>` +
      (w.status === 'none' ? '' : `<div><span>${w.status === 'ended' ? 'Ended' : 'Warranty ends'}</span><b>${fdate(w.end)}</b></div>`) + '</div>';
    const label = w.status === 'active' || w.status === 'soon' ? '<span class="today">Today</span>' : '';
    return `<div class="strip" data-status="${w.status}" role="img" aria-label="${esc(stat(w)[0])}. ${w.end ? 'Ends ' + fdate(w.end) : ''}">` +
      cable(it, { extra: label }) + dated + '</div>';
  }

  function itemPage(id) {
    const list = enriched(); const idx = list.findIndex(i => i.id === id); const it = list[idx]; const w = it.w;
    const [s1, s2] = stat(w);
    const prev = list[idx - 1], next = list[idx + 1];
    const fact = (k, v, sub) => `<div class="fact"><span>${k}</span><b>${v}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
    const spec = [
      ['Asset tag', it.tag], ['Category', it.category], ['Brand', it.brand], ['Model', it.model],
      ['Serial number', it.serial ? `<span class="mono">${esc(it.serial)}</span><button class="mini-copy" data-copy="${esc(it.serial)}" aria-label="Copy serial number">${I.copy}</button>` : 'Not recorded'],
      ['Store', it.store], ['Price', money(it.price)], ['Quantity', String(it.qty)], ['Location', it.location || 'No place set'],
    ].map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
    const pager = (x, cls, dir) => x ? `<a class="${cls}" href="#item-${x.id}">${dir === 'prev' ? I.left : ''}<span><small>${dir === 'prev' ? 'Previous' : 'Next'}</small><b>${esc(x.name)}</b></span>${dir === 'next' ? I.right : ''}</a>` : '<span></span>';
    return `
    <a class="back" href="#overview">${I.left}Overview</a>
    <article class="paper" data-status="${w.status}" aria-labelledby="item-h">
      <div class="sheet-head">
        <div>
          <span class="tag">${it.tag}, ${esc(it.category)}</span>
          <h1 id="item-h">${esc(it.name)}</h1>
          <p class="model">${esc(it.brand + ' ' + it.model)}</p>
        </div>
        <div class="acts">
          <button class="btn btn-line" data-stub-btn>${I.edit}Edit item</button>
          <button class="btn btn-solid" data-copy="${esc(it.serial)}" ${it.serial ? '' : 'disabled style="opacity:.4;pointer-events:none"'}>${I.copy}Copy serial number</button>
        </div>
      </div>
      ${strip(it)}
      <div class="verdict"><span class="chip"><i></i>${WORD[w.status]}</span><p>${esc(s1)}</p></div>
      <div class="facts">
        ${fact('Bought', fdate(it.bought), 'at ' + esc(it.store))}
        ${fact('Warranty', it.months ? plural(it.months, 'month') : 'None', it.months ? 'from the purchase date' : 'None recorded for this item')}
        ${fact(w.status === 'ended' ? 'Ended' : 'Ends', w.end ? fdate(w.end) : 'Not applicable', w.status === 'none' ? '' : esc(w.status === 'ended' ? s1 : s2))}
      </div>
      <div class="sheet-cols">
        <section aria-labelledby="h-spec"><h2 id="h-spec">Details</h2><dl class="spec">${spec}</dl></section>
        <section aria-labelledby="h-doc"><h2 id="h-doc">Invoice and photos</h2>
          <button class="drop" data-stub-btn>${I.file}<b>Add the invoice</b><span>Drop a PDF or photo here, up to 4 MB each. Keep it for claims.</span></button>
          <div class="notes"><h3>Notes</h3><p>No notes yet.</p></div>
        </section>
      </div>
      <nav class="pager" aria-label="Other items">${pager(prev, 'prev', 'prev')}${pager(next, 'next', 'next')}</nav>
    </article>`;
  }

  let filter = 'all';
  function itemsPage() {
    const list = enriched();
    const f = { all: () => true, active: i => i.w.status === 'active', soon: i => i.w.status === 'soon', ended: i => ['ended', 'none'].includes(i.w.status) }[filter];
    const shown = list.filter(f).sort((a, b) => (a.w.end ?? 9e15) - (b.w.end ?? 9e15));
    return `
    <div class="page-head"><div><h1 class="title">Items</h1><p>${plural(shown.length, 'item')} shown, soonest warranty first</p></div>
      <div class="filters" role="group" aria-label="Filter by warranty">
        ${[['all', 'All'], ['active', 'Covered'], ['soon', 'Ending soon'], ['ended', 'Not covered']].map(([k, l]) => `<button data-filter="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}
      </div>
    </div>
    <section class="tile"><ul class="rows">${shown.map(row).join('') || '<li style="padding:14px 10px;color:var(--mu)">No items match this filter. Choose All to see everything.</li>'}</ul></section>`;
  }

  function stubPage(name) {
    return `<div class="page-head"><div><h1 class="title">${name}</h1><p>This page is not part of the mockup. Overview, Items and each item page are.</p></div></div>
      <a class="btn btn-solid" href="#overview">Back to Overview</a>`;
  }

  /* ---------- Router ---------- */
  const view = $('#view');
  const parse = () => {
    const h = location.hash.slice(1) || 'overview'; const m = /^item-(\d+)$/.exec(h);
    if (m && ITEMS.some(i => i.id === +m[1])) return { name: 'item', id: +m[1] };
    return { name: ['overview', 'items', 'timeline', 'places', 'backup'].includes(h) ? h : 'overview' };
  };
  let current = null;
  function render() {
    const r = parse(); current = r;
    const titles = { overview: 'Overview', items: 'Items', timeline: 'Timeline', places: 'Places', backup: 'Backup' };
    view.innerHTML = r.name === 'overview' ? overview() : r.name === 'items' ? itemsPage() : r.name === 'item' ? itemPage(r.id) : stubPage(titles[r.name]);
    document.title = (r.name === 'item' ? ITEMS[r.id - 1].name : titles[r.name]) + ', Benchlog Signal mockup';
    const navKey = r.name === 'item' ? 'items' : r.name;
    $$('[data-nav]').forEach(a => { if (a.dataset.nav === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    movePill(); window.scrollTo(0, 0);
  }
  function mark(id) {
    $$('[data-vtn]').forEach(e => { e.style.viewTransitionName = ''; e.removeAttribute('data-vtn'); });
    if (id == null) return;
    const el = $(`.strip .cable[data-id="${id}"]`) || $(`.cable[data-id="${id}"]`);
    if (el) { el.style.viewTransitionName = 'cable'; el.setAttribute('data-vtn', ''); }
  }
  function transition(fn, id) {
    if (!document.startViewTransition || reduce.matches) { fn(); return; }
    mark(id);
    const t = document.startViewTransition(() => { fn(); mark(id); });
    t.finished.finally(() => mark(null));
  }
  function go(hash) {
    if (location.hash === hash) return;
    const from = current && current.name === 'item' ? current.id : null;
    const next = /^#item-(\d+)$/.exec(hash); const to = next ? +next[1] : null;
    transition(() => { history.pushState(null, '', hash); render(); }, to ?? from);
  }
  addEventListener('popstate', () => {
    const from = current && current.name === 'item' ? current.id : null; const r = parse();
    transition(render, r.name === 'item' ? r.id : from);
  });

  /* Nav pill that slides to the active link */
  function movePill() {
    const nav = $('#nav'), pill = $('.pill', nav), a = $('a[aria-current="page"]', nav);
    if (!a || !nav.offsetWidth) { pill.style.opacity = 0; return; }
    pill.style.opacity = 1; pill.style.width = a.offsetWidth + 'px'; pill.style.transform = `translateX(${a.offsetLeft}px)`;
  }
  addEventListener('resize', movePill);
  document.fonts && document.fonts.ready.then(movePill);

  /* ---------- Theme ---------- */
  function setScheme(s) {
    document.documentElement.dataset.scheme = s;
    try { localStorage.setItem('benchlog-scheme', s); } catch (e) {}
  }
  const flip = () => { const s = document.documentElement.dataset.scheme === 'dark' ? 'light' : 'dark'; transition(() => setScheme(s), null); };
  $('#theme').addEventListener('click', flip);

  /* ---------- Toast ---------- */
  let tt; function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }

  /* ---------- Delegated clicks ---------- */
  document.addEventListener('click', e => {
    const copy = e.target.closest('[data-copy]');
    if (copy) { const v = copy.dataset.copy; if (!v) { toast('No serial number recorded for this item.'); return; }
      try { navigator.clipboard.writeText(v); } catch (er) {} toast('Serial number copied'); return; }
    const off = e.target.closest('[data-offset]');
    if (off) { offset = +off.dataset.offset; transition(render, null); return; }
    const fl = e.target.closest('[data-filter]');
    if (fl) { filter = fl.dataset.filter; transition(render, null); return; }
    if (e.target.closest('[data-stub-btn]')) { toast('The add and edit forms are not part of this mockup.'); return; }
    const a = e.target.closest('a[href^="#"]');
    if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey) {
      e.preventDefault();
      if (a.hasAttribute('data-stub')) { toast(a.textContent.trim() + ' is not part of this mockup.'); return; }
      go(a.getAttribute('href')); view.focus({ preventScroll: true });
    }
  });

  /* ---------- Command palette ---------- */
  const dlg = $('#palette'), qIn = $('#q'), resUl = $('#results');
  let sel = 0, shownCmds = [];
  function commands() {
    const list = enriched();
    const items = list.map(i => ({ label: i.name, hint: i.brand + ' ' + i.model, status: i.w.status, run: () => go('#item-' + i.id), key: [i.name, i.brand, i.model, i.tag, i.serial, i.location, i.category].join(' ') }));
    const acts = [
      { label: 'Go to Overview', hint: 'Page', run: () => go('#overview'), key: 'overview home' },
      { label: 'Go to Items', hint: 'Page', run: () => go('#items'), key: 'items list all' },
      { label: 'Switch colour theme', hint: 'Action', run: flip, key: 'theme dark light colour' },
      { label: 'Add item', hint: 'Action', run: () => toast('The add form is not part of this mockup.'), key: 'add new item' },
      { label: 'Preview: in 3 weeks', hint: 'Mockup', run: () => { offset = 21; go('#overview'); transition(render, null); }, key: 'preview date amber soon' },
      { label: 'Preview: today', hint: 'Mockup', run: () => { offset = 0; transition(render, null); }, key: 'preview date today reset' },
    ];
    return [...items, ...acts];
  }
  function paint() {
    const q = qIn.value.trim().toLowerCase(); const all = commands();
    shownCmds = q ? all.filter(c => q.split(/\s+/).every(w => c.key.toLowerCase().includes(w) || c.label.toLowerCase().includes(w))) : all;
    sel = Math.min(sel, Math.max(shownCmds.length - 1, 0));
    resUl.innerHTML = shownCmds.length ? shownCmds.map((c, i) =>
      `<li role="presentation"><button role="option" data-i="${i}" aria-selected="${i === sel}" ${c.status ? `data-status="${c.status}"` : ''}>${c.status ? '<span class="dot"></span>' : ''}${esc(c.label)}<small>${esc(c.hint)}</small></button></li>`).join('')
      : `<li class="none">Nothing matches “${esc(qIn.value)}”. Try a brand, a serial number or a place.</li>`;
    const s = $('[aria-selected="true"]', resUl); s && s.scrollIntoView({ block: 'nearest' });
  }
  function openFind() { qIn.value = ''; sel = 0; paint(); if (!dlg.open) dlg.showModal(); qIn.focus(); }
  function run(i) { const c = shownCmds[i]; if (!c) return; dlg.close(); setTimeout(c.run, 40); }
  $('#open-find').addEventListener('click', openFind);
  qIn.addEventListener('input', () => { sel = 0; paint(); });
  qIn.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % Math.max(shownCmds.length, 1); paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + shownCmds.length) % Math.max(shownCmds.length, 1); paint(); }
    else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
  });
  resUl.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) run(+b.dataset.i); });
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); dlg.open ? dlg.close() : openFind(); }
    else if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName) && !dlg.open) { e.preventDefault(); openFind(); }
  });
  $$('.find').forEach(b => b.addEventListener('click', openFind));

  render();
})();
</script>
</body>
</html>
